<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Curve Magiche — Wet Shapo</title>
  <meta name="description" content="Ascolta Curve Magiche di Wet Shapo su tutte le piattaforme." />

  <!-- Open Graph / condivisione social -->
  <meta property="og:title" content="Curve Magiche — Wet Shapo" />
  <meta property="og:image" content="assets/images/cover-raw.jpg" />
  <meta property="og:type" content="music.song" />

  <link rel="stylesheet" href="style.css" />

  <!-- =========================================================
       📍 QUI VANNO GLI SCRIPT ESTERNI (Google Analytics, Meta Pixel, ecc)
       Incolla i tuoi snippet tra questi commenti, senza toccare il resto.
       ========================================================= -->
  <!-- HEAD_SCRIPTS_START -->

  <!-- HEAD_SCRIPTS_END -->

</head>
<body>

  <div class="page">

    <!-- Glow di sfondo -->
    <div class="bg-glow"></div>

    <div class="container">

      <!-- Firma artista -->
      <img class="signature" id="signature" src="" alt="firma artista" />

      <!-- Cover -->
      <div class="cover-wrap">
        <img class="cover" id="cover" src="" alt="cover del singolo" />
      </div>

      <!-- Titolo -->
      <div class="titles">
        <h1 id="track-title"></h1>
        <p id="artist-name"></p>
      </div>

      <!-- Card piattaforme -->
      <div class="platforms-card" id="platforms-card">
        <!-- generato via JS da config.js -->
      </div>

      <!-- Instagram -->
      <a class="instagram" id="instagram-link" href="#" target="_blank" rel="noopener">
        <img class="ig-icon" src="assets/icons/instagram.svg" alt="" aria-hidden="true" />
        <span id="instagram-username"></span>
      </a>
      <br />
      <a href="https://www.instagram.com/lordgag_/" aligne = "center" target="_blank" rel="noopener" style="color: rgba(117, 117, 117, 0.4); font-size: 14px; font-family: SF Pro Text , sans-serif; font-weight: 400; word-wrap: break-word; text-decoration: none; margin-left: 10px;">Designed by: @lordgag_</a>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
